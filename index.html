<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Arch2D Elevation Architect — Media Wall Planner &amp; AI Render Studio</title>
  <meta name="description" content="Draft true-to-scale 2D elevations of media walls, cabinetry and shelving, apply architectural textures, export 2000px+ reference PNGs and generate AI renders from structured prompts." />
  <meta name="theme-color" content="#0b0d11" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
/* === src/tokens.css === */
/* Arch2D — design tokens (Phase 0). */
:root {
  /* Surfaces */
  --bg-0: #0b0d11;
  --bg-1: #12151b;
  --bg-2: #181c24;
  --bg-3: #20252f;
  --glass: rgba(22, 26, 34, 0.72);
  --glass-strong: rgba(18, 21, 28, 0.9);
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);

  /* Text */
  --text-0: #f3f1ec;
  --text-1: #c4c7ce;
  --text-2: #8a909c;
  --text-3: #5d636f;

  /* Accents */
  --brass: hsl(36, 58%, 62%);
  --brass-strong: hsl(34, 70%, 55%);
  --brass-soft: hsla(36, 58%, 62%, 0.14);
  --cyan: hsl(190, 85%, 60%);
  --cyan-soft: hsla(190, 85%, 60%, 0.16);
  --danger: hsl(4, 72%, 62%);
  --danger-soft: hsla(4, 72%, 62%, 0.14);
  --success: hsl(150, 50%, 55%);

  --grad-brand: linear-gradient(135deg, hsl(36, 70%, 64%) 0%, hsl(20, 65%, 56%) 100%);
  --grad-panel: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);

  /* Type */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-md: 13px;
  --fs-lg: 15px;
  --fs-xl: 18px;

  /* Spacing & shape */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  --shadow-2: 0 10px 40px rgba(0, 0, 0, 0.45);
  --ring: 0 0 0 2px hsla(36, 58%, 62%, 0.45);

  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 120ms;
  --t-med: 220ms;

  --header-h: 56px;
  --sidebar-w: 280px;
  --inspector-w: 300px;
}
</style>
<style>
/* === src/ui.css === */
/* Arch2D — WS4: UI Shell, sidebars, forms, and inspector CSS */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-0);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

/* App container */
.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-columns: var(--sidebar-w) 1fr var(--inspector-w);
  grid-template-areas:
    "header header header"
    "left   stage  right";
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.app-header {
  grid-area: header;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-4);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.brand-mark {
  width: 20px;
  height: 20px;
  border-radius: var(--r-sm);
  background: var(--grad-brand);
}
.brand-title {
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--text-0);
  letter-spacing: -0.01em;
}
.brand-title span {
  font-weight: 400;
  color: var(--text-2);
  margin-left: 4px;
}
.badge {
  font-size: var(--fs-xs);
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--bg-3);
  color: var(--text-2);
  border: 1px solid var(--line);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* Buttons and Controls */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease);
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  background: var(--bg-3);
  border-color: var(--line-strong);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.primary {
  background: var(--grad-brand);
  color: #0d0f12;
  border: none;
  font-weight: 700;
}
.btn.primary:hover:not(:disabled) {
  filter: brightness(1.1);
  box-shadow: 0 0 16px hsla(36, 70%, 64%, 0.35);
}
.btn.ghost {
  background: none;
  border-color: transparent;
  color: var(--text-1);
}
.btn.ghost:hover:not(:disabled) {
  background: var(--bg-2);
  color: var(--text-0);
}
.btn.danger {
  color: var(--danger);
  border-color: var(--danger-soft);
}
.btn.danger:hover:not(:disabled) {
  background: var(--danger-soft);
}
.btn.sm {
  padding: 4px 8px;
  font-size: var(--fs-xs);
}
.btn-group {
  display: inline-flex;
  border-radius: var(--r-md);
  background: var(--bg-2);
  border: 1px solid var(--line);
}
.btn-group .btn {
  border: none;
  border-radius: 0;
}
.btn-group .btn:not(:last-child) {
  border-right: 1px solid var(--line);
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text-2);
  padding: 6px;
  border-radius: var(--r-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover {
  color: var(--text-0);
  background: var(--bg-3);
}

/* Inputs & Selects */
.input, .select {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-sm);
  transition: border-color var(--t-fast);
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--brass);
  box-shadow: var(--ring);
}
.select-wrap {
  position: relative;
  display: inline-block;
}

/* Sidebars */
.sidebar {
  background: var(--bg-1);
  border-color: var(--line);
  overflow-y: auto;
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}
.sidebar-left {
  grid-area: left;
  border-right: 1px solid var(--line);
}
.sidebar-right {
  grid-area: right;
  border-left: 1px solid var(--line);
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.section-heading {
  font-size: var(--fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-2);
}

/* Form layouts */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
}
.form-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-label {
  font-size: var(--fs-xs);
  color: var(--text-2);
}

/* Presets Library Buttons */
.presets-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.preset-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-size: var(--fs-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--t-fast);
  text-align: left;
}
.preset-item-btn:hover {
  background: var(--bg-3);
  border-color: var(--brass);
}
.preset-dims {
  font-size: var(--fs-xs);
  color: var(--text-2);
  font-family: var(--font-mono);
}

/* Texture Selector Grid */
.texture-picker-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.texture-tile {
  padding: 8px 4px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-1);
  font-size: var(--fs-xs);
  text-align: center;
  cursor: pointer;
  transition: all var(--t-fast);
}
.texture-tile:hover {
  border-color: var(--brass);
  color: var(--text-0);
}
.texture-tile.active {
  border-color: var(--brass-strong);
  background: var(--brass-soft);
  color: var(--brass-strong);
  font-weight: 600;
}

/* Stage Area & Canvas */
.stage {
  grid-area: stage;
  position: relative;
  background: var(--bg-0);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.stage-toolbar {
  position: absolute;
  top: var(--sp-3);
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  background: var(--glass);
  backdrop-filter: blur(8px);
  padding: 4px 8px;
  border-radius: var(--r-xl);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}
.canvas-host {
  width: 100%;
  height: 100%;
  position: relative;
}
.stage-hint {
  position: absolute;
  bottom: var(--sp-3);
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-xs);
  color: var(--text-3);
  pointer-events: none;
}

/* Toast notifications */
.toast-stack {
  position: fixed;
  bottom: var(--sp-5);
  right: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  z-index: 2000;
  pointer-events: none;
}
.toast {
  padding: 10px 16px;
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  font-size: var(--fs-sm);
  color: var(--text-0);
  pointer-events: auto;
  animation: toastIn var(--t-fast) var(--ease);
}
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }
.toast.info { border-color: var(--cyan); }
@keyframes toastIn {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Responsive collapse for mobile & tablets */
.only-mobile { display: none; }
@media (max-width: 900px) {
  .app {
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-areas:
      "header header"
      "left   stage";
  }
  .sidebar-right {
    position: fixed;
    right: 0;
    top: var(--header-h);
    bottom: 0;
    width: 320px;
    z-index: 90;
    box-shadow: var(--shadow-2);
    transform: translateX(100%);
    transition: transform var(--t-med) var(--ease);
  }
  .sidebar-right.open {
    transform: translateX(0);
  }
  .hide-sm { display: none; }
}
@media (max-width: 680px) {
  .only-mobile { display: inline-flex; }
  .app {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "stage";
  }
  .sidebar-left {
    position: fixed;
    left: 0;
    top: var(--header-h);
    bottom: 0;
    width: 290px;
    z-index: 95;
    box-shadow: var(--shadow-2);
    transform: translateX(-100%);
    transition: transform var(--t-med) var(--ease);
  }
  .sidebar-left.open {
    transform: translateX(0);
  }
}
</style>
<style>
/* === src/studio.css === */
/* Arch2D — WS6: AI Render & Prompt Studio modal styles */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 9, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-med) var(--ease);
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.studio-modal {
  width: 100%;
  max-width: 1140px;
  height: 90vh;
  max-height: 820px;
  background: var(--bg-1);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalPop var(--t-med) var(--ease);
}
@keyframes modalPop {
  from { transform: scale(0.97) translateY(10px); }
  to { transform: scale(1) translateY(0); }
}

.studio-header {
  height: 60px;
  padding: 0 var(--sp-5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}
.studio-title {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: var(--fs-lg);
  font-weight: 700;
  color: var(--text-0);
}
.studio-tabs {
  display: flex;
  gap: var(--sp-2);
}
.studio-tab {
  background: none;
  border: none;
  color: var(--text-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  font-size: var(--fs-md);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t-fast);
}
.studio-tab:hover {
  color: var(--text-0);
  background: var(--bg-3);
}
.studio-tab.active {
  color: var(--brass-strong);
  background: var(--brass-soft);
}

.studio-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* Two-column layout in Studio */
.studio-col-left {
  flex: 1.1;
  padding: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  overflow-y: auto;
  border-right: 1px solid var(--line);
}
.studio-col-right {
  flex: 0.9;
  padding: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  overflow-y: auto;
  background: var(--bg-0);
}

.studio-section-title {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--text-2);
  margin-bottom: var(--sp-1);
}

.prompt-textarea {
  width: 100%;
  height: 180px;
  padding: var(--sp-3);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.5;
  resize: vertical;
  transition: border-color var(--t-fast);
}
.prompt-textarea:focus {
  outline: none;
  border-color: var(--brass);
  box-shadow: var(--ring);
}

.studio-tip-banner {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  padding: 10px 14px;
  background: rgba(200, 161, 101, 0.08);
  border: 1px solid rgba(200, 161, 101, 0.25);
  border-radius: var(--r-md);
  font-size: var(--fs-xs);
  color: var(--text-1);
  line-height: 1.45;
}
.studio-action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.chip-group {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}
.chip-btn {
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--text-1);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: var(--fs-xs);
  cursor: pointer;
  transition: all var(--t-fast);
}
.chip-btn:hover {
  border-color: var(--brass);
  color: var(--text-0);
}
.chip-btn.active {
  background: var(--brass-soft);
  border-color: var(--brass-strong);
  color: var(--brass-strong);
}

/* Provider selector cards */
.provider-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
}
.provider-card {
  padding: var(--sp-3);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all var(--t-fast);
  text-align: left;
}
.provider-card:hover {
  border-color: var(--line-strong);
}
.provider-card.active {
  border-color: var(--brass);
  background: var(--brass-soft);
}
.provider-card-name {
  font-weight: 600;
  font-size: var(--fs-md);
  color: var(--text-0);
}
.provider-card-sub {
  font-size: var(--fs-xs);
  color: var(--text-2);
  margin-top: 2px;
}

.provider-config-box {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

/* Render preview & comparison */
.render-preview-box {
  flex: 1;
  min-height: 280px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.render-preview-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}

/* Split slider comparison */
.split-viewer {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  user-select: none;
}
.split-img-cad, .split-img-render {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.split-img-cad {
  background: #ffffff;
}
.split-overlay {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  overflow: hidden;
}
.split-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--brass-strong);
  cursor: ew-resize;
}
.split-handle::after {
  content: '◂ ▸';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-0);
  border: 1px solid var(--brass);
  color: var(--brass);
  font-size: 10px;
  padding: 3px 6px;
  border-radius: 10px;
}

/* Security notice banner */
.security-note {
  font-size: var(--fs-xs);
  color: var(--text-2);
  background: rgba(255, 255, 255, 0.03);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  border-left: 2px solid var(--brass);
  line-height: 1.4;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}
.gallery-thumb {
  aspect-ratio: 16/9;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: all var(--t-fast);
}
.gallery-thumb:hover {
  border-color: var(--brass);
  transform: translateY(-2px);
}
.gallery-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
<style>
/* === src/library.css === */
/* Arch2D — House Item Library & Custom Prompt modal styles */

.library-modal {
  width: 100%;
  max-width: 1100px;
  height: 88vh;
  max-height: 840px;
  background: var(--bg-1);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalPop var(--t-med) var(--ease);
}

.library-header {
  height: 64px;
  padding: 0 var(--sp-5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  flex-shrink: 0;

/* === src/00-namespace.js === */
/* Arch2D — shared namespace and utilities (Phase 0). See CONTRACTS.md. */
(function () {
  'use strict';
  const A = (window.Arch2D = window.Arch2D || {});
  A.version = '2.0.0';

  const util = {
    uid() {
      return 'el_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    },
    clamp(v, a, b) {
      return Math.min(b, Math.max(a, v));
    },
    round(v, step = 1) {
      return Math.round(v / step) * step;
    },
    clone(o) {
      return JSON.parse(JSON.stringify(o));
    },
    /** Tiny DOM builder: h('div', {class:'x', onclick: fn}, 'text', childNode) */
    h(tag, attrs, ...children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (v === undefined || v === null || v === false) continue;
          if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
          else if (k === 'class') node.className = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
          else if (k === 'html') node.innerHTML = v;
          else if (k in node && typeof v !== 'string') node[k] = v;
          else node.setAttribute(k, v === true ? '' : v);
        }
      }
      for (const c of children.flat()) {
        if (c === null || c === undefined || c === false) continue;
        node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      }
      return node;
    },
    downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      util.downloadDataUrl(url, name);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
    downloadDataUrl(url, name) {
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    },
    debounce(fn, ms) {
      let t;
      return function (...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), ms);
      };
    },
    hashString(s) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return h >>> 0;
    },
    /** Deterministic PRNG (mulberry32). */
    rng(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    hexToRgb(hex) {
      let h = String(hex || '#000000').replace('#', '');
      if (h.length === 3) h = h.split('').map((c) => c + c).join('');
      const n = parseInt(h, 16) || 0;
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    },
    rgba(hex, a) {
      const { r, g, b } = util.hexToRgb(hex);
      return `rgba(${r},${g},${b},${a})`;
    },
    /** amt in [-1, 1]: negative darkens, positive lightens. */
    shade(hex, amt) {
      const { r, g, b } = util.hexToRgb(hex);
      const f = (c) => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
      return '#' + [f(r), f(g), f(b)].map((c) => util.clamp(c, 0, 255).toString(16).padStart(2, '0')).join('');
    },
    luminance(hex) {
      const { r, g, b } = util.hexToRgb(hex);
      return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    },
    isTypingTarget(el) {
      if (!el) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    },
  };

  A.util = util;
})();

<script>
/* === src/01-bus.js === */
/* Arch2D — event bus (Phase 0). */
(function () {
  'use strict';
  const A = window.Arch2D;
  const handlers = new Map();

  A.bus = {
    on(evt, fn) {
      if (!handlers.has(evt)) handlers.set(evt, new Set());
      handlers.get(evt).add(fn);
      return () => A.bus.off(evt, fn);
    },
    off(evt, fn) {
      const set = handlers.get(evt);
      if (set) set.delete(fn);
    },
    emit(evt, payload) {
      const set = handlers.get(evt);
      if (!set) return;
      for (const fn of [...set]) {
        try {
          fn(payload);
        } catch (err) {
          console.error(`[Arch2D bus] handler for "${evt}" failed:`, err);
        }
      }
    },
  };
})();

<script>
/* === src/state.js === */
/* Arch2D — WS1: state store, selection and undo/redo history (project.md §3.5, §5). */
(function () {
  'use strict';
  const A = window.Arch2D;
  const { clamp, clone, uid } = A.util;
  const V = A.vocab;

  const SCHEMA_VERSION = 1;
  const LIMIT = V.config.historyLimit;

  let state = emptyState();
  let selection = [];
  const undoStack = []; // serialized snapshots (strings)
  const redoStack = [];
  let txnSnapshot = null; // snapshot taken at begin()

  function emptyState() {
    return { schemaVersion: SCHEMA_VERSION, name: 'Untitled media wall', wallWidth: 400, wallHeight: 280, mood: 'japandi', elements: [] };
  }

  /* ---------- validation / normalization ---------- */
  const num = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? v : d);
  const isHex = (s) => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);

  function normalizeElement(raw, i, errors) {
    if (!raw || typeof raw !== 'object') {
      errors.push(`elements[${i}] is not an object`);
      return null;
    }
    const type = V.presets[raw.type] ? raw.type : 'custom';
    const preset = V.presets[type];
    const texture = V.textures[raw.texture] ? raw.texture : preset.texture;
    return {
      id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
      type,
      label: typeof raw.label === 'string' && raw.label.trim() ? raw.label.slice(0, 80) : preset.label,
      x: num(raw.x, 0),
      y: num(raw.y, 0),
      width: Math.max(V.config.minSizeCm, num(raw.width, preset.width)),
      height: Math.max(V.config.minSizeCm, num(raw.height, preset.height)),
      texture,
      color: isHex(raw.color) ? raw.color.toLowerCase() : V.textures[texture].defaultColor,
      opacity: clamp(num(raw.opacity, 1), 0.05, 1),
      ledHalo: !!raw.ledHalo,
      ledTemp: raw.ledTemp === 4000 ? 4000 : 3000,
      ledUnderglow: !!raw.ledUnderglow,
      zIndex: i,
    };
  }

  function validate(obj) {
    const errors = [];
    if (!obj || typeof obj !== 'object') return { ok: false, errors: ['Project file is not a JSON object.'], value: null };
    if (obj.schemaVersion !== SCHEMA_VERSION) {
      return { ok: false, errors: [`Unsupported schemaVersion: ${obj.schemaVersion} (expected ${SCHEMA_VERSION}).`], value: null };
    }
    if (!Array.isArray(obj.elements)) return { ok: false, errors: ['"elements" must be an array.'], value: null };
    const value = {
      schemaVersion: SCHEMA_VERSION,
      name: typeof obj.name === 'string' && obj.name.trim() ? obj.name.slice(0, 120) : 'Untitled media wall',
      wallWidth: clamp(num(obj.wallWidth, 400), 50, 5000),
      wallHeight: clamp(num(obj.wallHeight, 280), 50, 2000),
      mood: V.moods[obj.mood] ? obj.mood : 'japandi',
      elements: [],
    };
    const sorted = obj.elements
      .map((e, i) => ({ e, i }))
      .sort((a, b) => num(a.e && a.e.zIndex, a.i) - num(b.e && b.e.zIndex, b.i) || a.i - b.i);
    const seen = new Set();
    sorted.forEach(({ e }, i) => {
      const el = normalizeElement(e, i, errors);
      if (!el) return;
      if (seen.has(el.id)) el.id = uid();
      seen.add(el.id);
      value.elements.push(el);
    });
    value.elements.forEach((el, i) => (el.zIndex = i));
    return { ok: true, errors, value };
  }

  /* ---------- core ---------- */
  const snap = () => JSON.stringify(state);

  function emitState(reason) {
    A.bus.emit('state:changed', { state, reason });
  }
  function emitHistory() {
    A.bus.emit('history:changed', { canUndo: undoStack.length > 0, canRedo: redoStack.length > 0 });
  }
  function pushUndo(snapshot) {
    undoStack.push(snapshot);
    if (undoStack.length > LIMIT) undoStack.shift();
    redoStack.length = 0;
    emitHistory();
  }
  function pruneSelection() {
    const ids = new Set(state.elements.map((e) => e.id));
    const next = selection.filter((id) => ids.has(id));
    if (next.length !== selection.length) {
      selection = next;
      A.bus.emit('selection:changed', { ids: selection.slice() });
    }
  }

  function update(fn, opts = {}) {
    const record = opts.record !== false && !txnSnapshot;
    const before = record ? snap() : null;
    const draft = clone(state);
    fn(draft);
    draft.elements.forEach((el, i) => (el.zIndex = i));
    state = draft;
    if (record && before !== snap()) pushUndo(before);
    pruneSelection();
    emitState(opts.reason || 'update');
  }

  const store = {
    SCHEMA_VERSION,
    getState: () => state,
    validate,
    update,

    begin() {
      if (!txnSnapshot) txnSnapshot = snap();
    },
    commit() {
      if (!txnSnapshot) return;
      const before = txnSnapshot;
      txnSnapshot = null;
      if (before !== snap()) pushUndo(before);
    },
    cancel() {
      if (!txnSnapshot) return;
      state = JSON.parse(txnSnapshot);
      txnSnapshot = null;
      pruneSelection();
      emitState('cancel');
    },
    inTransaction: () => !!txnSnapshot,

    /* selection */
    getSelection: () => selection.slice(),
    getSelectedElements: () => state.elements.filter((e) => selection.includes(e.id)),
    select(ids, opts = {}) {
      ids = (Array.isArray(ids) ? ids : [ids]).filter(Boolean);
      let next;
      if (opts.toggle) {
        next = selection.slice();
        for (const id of ids) {
          const i = next.indexOf(id);
          if (i >= 0) next.splice(i, 1);
          else next.push(id);
        }
      } else if (opts.additive) {
        next = [...new Set([...selection, ...ids])];
      } else next = ids.slice();
      const changed = next.length !== selection.length || next.some((id, i) => id !== selection[i]);
      selection = next;
      if (changed) A.bus.emit('selection:changed', { ids: selection.slice() });
    },
    selectAll() {
      store.select(state.elements.map((e) => e.id));
    },
    clearSelection() {
      store.select([]);
    },

    /* element helpers */
    addElement(partial = {}) {
      const type = V.presets[partial.type] ? partial.type : 'custom';
      const p = V.presets[type];
      const el = normalizeElement(
        Object.assign(
          {
            type,
            label: p.label,
            width: p.width,
            height: p.height,
            texture: p.texture,
            color: p.color,
            x: Math.round((state.wallWidth - (partial.width || p.width)) / 2),
            y: p.y,
            ledHalo: !!p.ledHalo,
            ledUnderglow: !!p.ledUnderglow,
          },
          partial,
          { id: uid() }
        ),
        state.elements.length,
        []
      );
      update((d) => d.elements.push(el), { reason: 'add' });
      store.select([el.id]);
      return el.id;
    },
    addPreset(key) {
      return store.addElement({ type: key });
    },
    removeElements(ids) {
      if (!ids || !ids.length) return;
      const set = new Set(ids);
      update((d) => (d.elements = d.elements.filter((e) => !set.has(e.id))), { reason: 'remove' });
    },
    duplicateElements(ids) {
      const set = new Set(ids || []);
      if (!set.size) return [];
      const newIds = [];
      update(
        (d) => {
          const copies = d.elements
            .filter((e) => set.has(e.id))
            .map((e) => {
              const c = Object.assign(clone(e), { id: uid(), x: e.x + 10, y: e.y + 10 });
              newIds.push(c.id);
              return c;
            });
          d.elements.push(...copies);
        },
        { reason: 'duplicate' }
      );
      store.select(newIds);
      return newIds;
    },
    bringForward(ids) {
      const set = new Set(ids || []);
      update(
        (d) => {
          const a = d.elements;
          for (let i = a.length - 2; i >= 0; i--) {
            if (set.has(a[i].id) && !set.has(a[i + 1].id)) [a[i], a[i + 1]] = [a[i + 1], a[i]];
          }
        },
        { reason: 'layer' }
      );
    },
    sendBackward(ids) {
      const set = new Set(ids || []);
      update(
        (d) => {
          const a = d.elements;
          for (let i = 1; i < a.length; i++) {
            if (set.has(a[i].id) && !set.has(a[i - 1].id)) [a[i], a[i - 1]] = [a[i - 1], a[i]];
          }
        },
        { reason: 'layer' }
      );
    },
    setWall({ wallWidth, wallHeight }) {
      update(
        (d) => {
          if (wallWidth !== undefined) d.wallWidth = clamp(Number(wallWidth) || d.wallWidth, 50, 5000);
          if (wallHeight !== undefined) d.wallHeight = clamp(Number(wallHeight) || d.wallHeight, 50, 2000);
        },
        { reason: 'wall' }
      );
    },
    setMood(id) {
      if (!V.moods[id]) return;
      update((d) => (d.mood = id), { reason: 'mood' });
    },

    /* history */
    canUndo: () => undoStack.length > 0,
    canRedo: () => redoStack.length > 0,
    undo() {
      if (txnSnapshot) store.commit();
      if (!undoStack.length) return false;
      redoStack.push(snap());
      state = JSON.parse(undoStack.pop());
      pruneSelection();
      emitHistory();
      emitState('undo');
      return true;
    },
    redo() {
      if (!redoStack.length) return false;
      undoStack.push(snap());
      state = JSON.parse(redoStack.pop());
      pruneSelection();
      emitHistory();
      emitState('redo');
      return true;
    },
    clearHistory() {
      undoStack.length = 0;
      redoStack.length = 0;
      emitHistory();
    },

    /* persistence primitives */
    serialize: () => JSON.stringify(state, null, 2),
    load(input, opts = {}) {
      let obj = input;
      if (typeof input === 'string') {
        try {
          obj = JSON.parse(input);
        } catch (e) {
          return { ok: false, errors: ['File is not valid JSON.'] };
        }
      }
      const res = validate(obj);
      if (!res.ok) return res;
      store.reset(res.value);
      A.bus.emit('project:loaded', { state, source: opts.source || 'load' });
      return { ok: true, errors: res.errors };
    },
    reset(next) {
      state = clone(next);
      txnSnapshot = null;
      store.clearHistory();
      selection = [];
      A.bus.emit('selection:changed', { ids: [] });
      emitState('reset');
    },
  };

  A.store = store;
})();
</script>

/* === src/persistence.js === */
/* Arch2D — WS1: JSON save/load, localStorage autosave and API-key storage (project.md §5). */
(function () {
  'use strict';
  const A = window.Arch2D;
  const AUTOSAVE_KEY = 'arch2d_autosave';
  const SECRET_PREFIX = 'arch2d_secret_';

  function safeStorage() {
    try {
      const k = '__arch2d_probe__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return localStorage;
    } catch (e) {
      return null; // private mode / blocked storage: app still works, just without autosave
    }
  }
  const storage = safeStorage();

  function fileName() {
    const name = (A.store.getState().name || 'arch2d')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '')
      .slice(0, 40) || 'arch2d';
    const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '');
    return `${name}-${ts}.arch2d.json`;
  }

  const persistence = {
    available: !!storage,

    saveToFile() {
      const blob = new Blob([A.store.serialize()], { type: 'application/json' });
      A.util.downloadBlob(blob, fileName());
    },

    /** Opens a file picker and loads the chosen project. Resolves {ok, errors, cancelled}. */
    openFile(inputEl) {
      return new Promise((resolve) => {
        const input = inputEl || Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
        const onChange = () => {
          input.removeEventListener('change', onChange);
          const file = input.files && input.files[0];
          input.value = '';
          if (!file) return resolve({ ok: false, cancelled: true, errors: [] });
          if (file.size > 5 * 1024 * 1024) return resolve({ ok: false, errors: ['File is larger than 5 MB — not an Arch2D project.'] });
          const reader = new FileReader();
          reader.onload = () => resolve(A.store.load(String(reader.result), { source: 'file' }));
          reader.onerror = () => resolve({ ok: false, errors: ['Could not read the file.'] });
          reader.readAsText(file);
        };
        input.addEventListener('change', onChange);
        input.click();
      });
    },

    hasAutosave() {
      return !!(storage && storage.getItem(AUTOSAVE_KEY));
    },
    readAutosave() {
      if (!storage) return null;
      try {
        const res = A.store.validate(JSON.parse(storage.getItem(AUTOSAVE_KEY)));
        return res.ok ? res.value : null;
      } catch (e) {
        return null;
      }
    },
    clearAutosave() {
      if (storage) storage.removeItem(AUTOSAVE_KEY);
    },
    writeAutosave() {
      if (!storage) return false;
      try {
        storage.setItem(AUTOSAVE_KEY, JSON.stringify(A.store.getState()));
        A.bus.emit('autosave:written', { at: Date.now() });
        return true;
      } catch (e) {
        console.warn('[Arch2D] autosave failed', e);
        return false;
      }
    },
    startAutosave() {
      const write = A.util.debounce(() => persistence.writeAutosave(), 400);
      A.bus.on('state:changed', write);
    },

    /* API keys — localStorage is NOT a secure vault (project.md §2 Security Note). */
    getSecret(k) {
      return storage ? storage.getItem(SECRET_PREFIX + k) || '' : '';
    },
    setSecret(k, v) {
      if (!storage) return;
      if (v) storage.setItem(SECRET_PREFIX + k, v);
      else storage.removeItem(SECRET_PREFIX + k);
    },
    getJSON(k, fallback) {
      if (!storage) return fallback;
      try {
        const v = storage.getItem('arch2d_' + k);
        return v ? JSON.parse(v) : fallback;
      } catch (e) {
        return fallback;
      }
    },
    setJSON(k, v) {
      if (storage) storage.setItem('arch2d_' + k, JSON.stringify(v));
    },
  };

  A.persistence = persistence;
})();
</script>

/* === src/textures.js === */
/* Arch2D — WS3: procedural Canvas 2D textures (project.md §3.7). No SVG, no external
   images, so export via toDataURL() can never be tainted. Deterministic per element id. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;

  const cache = new Map(); // LRU of pre-rendered static textures
  const CACHE_MAX = 96;

  /* ---------- helpers ---------- */
  function seeded(el, salt) {
    return U.rng(U.hashString(el.id + '|' + (salt || '')));
  }
  function doorSplits(ctx, w, h, s, color) {
    const doorCm = 60;
    if (w / s < 90 || h / s < 30) return;
    const n = Math.max(2, Math.round(w / s / doorCm));
    ctx.save();
    for (let i = 1; i < n; i++) {
      const x = Math.round((w / n) * i) + 0.5;
      ctx.strokeStyle = U.rgba(U.shade(color, -0.55), 0.55);
      ctx.lineWidth = Math.max(1, 0.25 * s);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
      ctx.strokeStyle = U.rgba('#ffffff', 0.12);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 1, 0);
      ctx.lineTo(x + 1, h);
      ctx.stroke();
    }
    ctx.restore();
  }
  function edgeShading(ctx, w, h, s) {
    // top highlight + bottom shadow lip gives every box a sense of depth
    const lip = Math.max(1, Math.min(h * 0.12, 1.2 * s));
    let g = ctx.createLinearGradient(0, 0, 0, lip * 2);
    g.addColorStop(0, 'rgba(255,255,255,0.16)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, lip * 2);
    g = ctx.createLinearGradient(0, h - lip * 2, 0, h);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = g;
    ctx.fillRect(0, h - lip * 2, w, lip * 2);
  }
  function noise(ctx, w, h, rand, density, alpha) {
    const count = Math.min(2200, Math.floor(w * h * density));
    for (let i = 0; i < count; i++) {
      ctx.fillStyle = rand() < 0.5 ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;

      g.addColorStop(0, U.shade(c, 0.05));
      g.addColorStop(1, U.shade(c, -0.05));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      noise(ctx, w, h, rand, 0.12, 0.035);
      doorSplits(ctx, w, h, s, c);
      edgeShading(ctx, w, h, s);
    },

    glass(ctx, el, w, h, s) {

      ctx.fillStyle = U.shade(c, -0.35);

      g.addColorStop(1, U.shade(c, -0.1));

      rg.addColorStop(1, 'rgba(120,150,190,0)');

      sheen.addColorStop(0.0, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.28, 'rgba(255,255,255,0.10)');
      sheen.addColorStop(0.36, 'rgba(255,255,255,0.02)');
      sheen.addColorStop(0.5, 'rgba(255,255,255,0)');

    mesh(ctx, el, w, h, s) {

      ctx.fillRect(0, 0, w, h);

      const tp = Math.max(2, Math.round(pitch));
      tile.width = tile.height = tp;

      g.addColorStop(0, 'rgba(0,0,0,0.25)');

      g.addColorStop(0.96, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.25)');

    niche(ctx, el, w, h, s) {

      g.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillRect(ix, iy, iw, Math.min(ih, 12 * s));
      g = ctx.createLinearGradient(ix, 0, ix + Math.min(iw, 6 * s), 0);
      g.addColorStop(0, 'rgba(0,0,0,0.22)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy, Math.min(iw, 6 * s), ih);

      // shelves every ~35cm with objects
      const shelfCm = 35;
      const nShelves = Math.max(0, Math.floor(ih / s / shelfCm) - 1);

          const end = ix + iw * (0.55 + rand() * 0.3);

            const bh = Math.min(bay * 0.9, (17 + rand() * 9) * s);
            ctx.fillStyle = palette[Math.floor(rand() * palette.length)];
            const lean = rand() < 0.08;

              ctx.rotate(-0.25);
              ctx.fillRect(0, -bh, bw, bh);
              ctx.restore();
              x += bw * 2.2;
            } else {
              ctx.fillRect(x, ly - bh, bw, bh);
              x += bw + 0.25 * s;

          if (rand() < 0.65 && end + 14 * s < ix + iw) {
            // vase
            const vx = end + (5 + rand() * 6) * s;
            const vh = Math.min(bay * 0.7, (12 + rand() * 10) * s);
            const vw = vh * (0.45 + rand() * 0.2);
            ctx.fillStyle = rand() < 0.5 ? '#e9e3d8' : '#3b3633';
            ctx.beginPath();
            ctx.ellipse(vx, ly - vh / 2, vw / 2, vh / 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        if (ly < iy + ih - 0.5) {
          ctx.fillStyle = U.shade(c, 0.12);
          ctx.fillRect(ix, ly - thick, iw, thick);
          g = ctx.createLinearGradient(0, ly, 0, ly + 4 * s);
          g.addColorStop(0, 'rgba(0,0,0,0.25)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(ix, ly, iw, 4 * s);
        }
        prev = ly;
      }
    },

    fireplace(ctx, el, w, h, s, time) {
      const c = el.color;
      const rand = seeded(el, 'fire');
      ctx.fillStyle = c;
      ctx.fillRect(0, 0, w, h);
      const inset = Math.max(2, 3 * s);
      const ix = inset, iy = inset, iw = Math.max(0, w - inset * 2), ih = Math.max(0, h - inset * 2);
      ctx.fillStyle = '#060504';
      ctx.fillRect(ix, iy, iw, ih);
      ctx.save();
      ctx.beginPath();
      ctx.rect(ix, iy, iw, ih);
      ctx.clip();
      // ember bed
      const bedH = Math.max(2, ih * 0.16);
      let g = ctx.createLinearGradient(0, iy + ih - bedH, 0, iy + ih);
      g.addColorStop(0, 'rgba(255,120,40,0.0)');
      g.addColorStop(0.5, 'rgba(255,110,30,0.65)');
      g.addColorStop(1, 'rgba(120,30,10,0.9)');
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy + ih - bedH, iw, bedH);

      ctx.globalCompositeOperation = 'lighter';
      const n = Math.max(4, Math.round(iw / (9 * s)));
      const t = (time || 0) / 1000;
      for (let i = 0; i < n; i++) {
        const phase = rand() * Math.PI * 2;
        const speed = 2 + rand() * 2.5;
        const fx = ix + (iw / n) * (i + 0.5) + Math.sin(t * 1.3 + phase) * (iw / n) * 0.15;
        const fh = ih * (0.45 + 0.35 * (0.5 + 0.5 * Math.sin(t * speed + phase)) + rand() * 0.1);
        const fw = (iw / n) * (0.9 + rand() * 0.6);
        const base = iy + ih - bedH * 0.4;
        const fg = ctx.createLinearGradient(0, base, 0, base - fh);
        fg.addColorStop(0, 'rgba(255,170,60,0.85)');
        fg.addColorStop(0.45, 'rgba(255,110,30,0.55)');
        fg.addColorStop(1, 'rgba(255,60,10,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(fx - fw / 2, base);
        ctx.quadraticCurveTo(fx - fw * 0.45, base - fh * 0.55, fx + Math.sin(t * 3 + phase) * fw * 0.15, base - fh);
        ctx.quadraticCurveTo(fx + fw * 0.45, base - fh * 0.55, fx + fw / 2, base);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      // glass reflection
      g = ctx.createLinearGradient(ix, iy, ix + iw * 0.6, iy + ih);
      g.addColorStop(0, 'rgba(255,255,255,0.08)');
      g.addColorStop(0.4, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy, iw, ih);
      ctx.restore();
    },
  };

  function paint(ctx, el, w, h, s, time) {
    (painters[el.texture] || painters.matte)(ctx, el, w, h, s, time);
  }

  const textures = {
    list() {
      return Object.entries(A.vocab.textures).map(([id, t]) => ({ id, label: t.label }));
    },
    animated(el) {
      return el.texture === 'fireplace';
    },
    /** Draw el's texture into rect (CSS px). opts: { pxPerCm, time } */
    draw(ctx, el, rect, opts = {}) {
      const s = opts.pxPerCm || 1;
      const w = rect.w, h = rect.h;
      if (w < 1 || h < 1) return;
      ctx.save();
      ctx.globalAlpha *= el.opacity == null ? 1 : el.opacity;
      if (textures.animated(el)) {
        ctx.beginPath();
        ctx.rect(rect.x, rect.y, w, h);
        ctx.clip();
        ctx.translate(rect.x, rect.y);
        paint(ctx, el, w, h, s, opts.time || 0);
        ctx.restore();
        return;
      }
      const m = ctx.getTransform();
      const scale = Math.max(1, Math.hypot(m.a, m.b));
      const key = [el.id, el.texture, el.color, Math.round(w), Math.round(h), s.toFixed(3), scale.toFixed(2)].join('|');
      let tile = cache.get(key);
      if (tile) {
        cache.delete(key);
        cache.set(key, tile);
      } else {
        tile = document.createElement('canvas');
        tile.width = Math.max(1, Math.ceil(w * scale));
        tile.height = Math.max(1, Math.ceil(h * scale));
        const tctx = tile.getContext('2d');
        tctx.scale(scale, scale);
        paint(tctx, el, w, h, s, 0);
        cache.set(key, tile);
        if (cache.size > CACHE_MAX) cache.delete(cache.keys().next().value);
      }
      ctx.drawImage(tile, rect.x, rect.y, w, h);
      ctx.restore();
    },
    clearCache() {
      cache.clear();
    },
  };

  A.textures = textures;
})();

/* === src/render.js === */
/* Arch2D — WS3: scene renderer shared by the interactive canvas and the PNG exporter

(function () {
  'use strict';

  const U = A.util;
  const V = A.vocab;

  function makeTransform(s, ox, oy) {

      s,
      x: (cm) => ox + cm * s,
      y: (cm) => oy - cm * s,
      cmX: (px) => (px - ox) / s,
      cmY: (px) => (oy - px) / s,

      { key: 'e', x: x2 - hs, y: cy - hs },
      { key: 'se', x: x2 - hs, y: y2 - hs },
      { key: 's', x: cx - hs, y: y2 - hs },
      { key: 'sw', x: r.x - hs, y: y2 - hs },
      { key: 'w', x: r.x - hs, y: cy - hs },

  /* ---------- wall surface ---------- */
  function wallPattern(ctx, mood, s) {
    const m = V.moods[mood] || V.moods.japandi;

    const tile = document.createElement('canvas');

      const bw = Math.max(8, 21.5 * s), bh = Math.max(3, 6.5 * s), mortar = Math.max(1, 1 * s);
      tile.width = Math.ceil(bw * 2);
      tile.height = Math.ceil((bh + mortar) * 2);

      t.fillRect(0, 0, tile.width, tile.height);
      const rand = U.rng(7);

        for (let col = -1; col < 3; col++) {
          const x = col * (bw + mortar) + (row % 2 ? bw / 2 : 0);
          t.fillStyle = U.shade(m.wall, (rand() - 0.5) * 0.22);
          t.fillRect(x, row * (bh + mortar), bw, bh);

    } else {
      tile.width = tile.height = 96;

        t.fillStyle = rand() < 0.5 ? 'rgba(0,0,0,0.025)' : 'rgba(255,255,255,0.03)';
        t.fillRect(rand() * 96, rand() * 96, 1 + rand() * 2, 1 + rand() * 2);

  function drawWall(ctx, state, T, o) {

    g.addColorStop(1, 'rgba(0,0,0,0)');

  function inkFor(state) {
    const m = V.moods[state.mood] || V.moods.japandi;

  }
